# Checks every pull request into main, and main itself after a merge.
# Make "Analyze and test" a required check in the branch protection rule for
# main, so nothing merges unless it passes.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.4
          channel: stable
          cache: true

      # .env is bundled as an asset but never committed; the example's
      # placeholder values are enough to analyze, test and build.
      - run: cp .env.example .env

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

  android-release:
    name: Android release signing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.4
          channel: stable
          cache: true

      - run: cp .env.example .env

      - run: flutter pub get

      # With no upload key on the runner, a release build must refuse to
      # sign with the debug key. This step passes only if the build fails
      # for that reason.
      - name: Release build refuses the debug key
        run: |
          if flutter build appbundle --release > build.log 2>&1; then
            echo "A release bundle was built without the upload key." && exit 1
          fi
          grep -q "Release signing key missing" build.log
